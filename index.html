<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sahil's Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #1a1918;
    color: #f3f2f2;
    font-family: 'Archivo', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: #ff9783; text-underline-offset: 3px; }
  a:hover { color: #ffc4b8; }
  button { font-family: inherit; }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid #ec3013; outline-offset: 2px; }
  ::selection { background: rgba(236,48,19,0.4); }
  input::placeholder { color: rgba(243,242,242,0.4); }

  .masthead {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 64px 40px 56px;
    text-align: center;
  }
  .masthead img { width: 340px; max-width: 100%; height: auto; }
  .masthead h1 {
    margin: 40px 0 0; font-weight: 800; font-size: clamp(48px, 8vw, 100px);
    line-height: 0.9; letter-spacing: -0.04em; text-transform: uppercase;
    color: #ec3013;
  }

  .fab {
    position: absolute; top: 24px; right: 24px; z-index: 5;
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    border: 0; background: #ec3013; color: #f3f2f2; cursor: pointer;
    transition: background 120ms linear;
  }
  .fab:hover { background: #ff563c; }
  .fab:active { background: #ff9783; }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 24px; padding: 0 40px 64px;
  }

  .card {
    position: relative; display: grid; place-items: center;
    aspect-ratio: 1 / 1; padding: 26px; overflow: hidden;
    border: 1px solid rgba(243,242,242,0.12); border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    text-decoration: none; color: inherit;
    transition: transform 180ms cubic-bezier(.2,.7,.3,1), box-shadow 180ms ease, border-color 180ms ease;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 22px 44px rgba(0,0,0,0.55), 0 0 0 1px rgba(236,48,19,0.35);
    border-color: rgba(236,48,19,0.4);
  }
  .card .pattern { position: absolute; inset: 0; opacity: 0.55; }
  .card .num { position: absolute; top: 20px; left: 24px; font-size: 11px; font-weight: 800; letter-spacing: 0.18em; }
  .card .arrow { position: absolute; top: 20px; right: 22px; opacity: 0.45; }
  .card .name {
    position: relative; text-align: center; color: #f3f2f2;
    font-weight: 800; font-size: clamp(34px, 4.2vw, 58px); line-height: 0.88;
    letter-spacing: -0.045em; text-transform: uppercase; text-wrap: balance;
  }
  .card .rule { position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%); width: 36px; height: 3px; }

  .overlay {
    position: fixed; inset: 0; display: grid; place-items: center;
    padding: 24px; background: rgba(10,9,9,0.7); z-index: 20;
  }
  .overlay[hidden] { display: none; }
  .modal {
    width: min(480px, 100%); background: #201e1d; border-top: 4px solid #ec3013;
    border-radius: 18px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); padding: 28px;
  }
  .modal h3 { margin: 0 0 4px; font-weight: 800; font-size: 24px; text-transform: uppercase; letter-spacing: -0.02em; }
  .modal .subcopy { margin: 0 0 20px; font-size: 13px; color: rgba(243,242,242,0.6); }
  .fields { display: flex; flex-direction: column; gap: 14px; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(243,242,242,0.6); margin-bottom: 6px; }
  .field input {
    width: 100%; height: 40px; padding: 0 12px; font-family: inherit; font-size: 14px;
    color: #f3f2f2; background: #1a1918; border: 1px solid rgba(243,242,242,0.22); border-radius: 10px;
  }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .btn-primary {
    height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: #ec3013; color: #f3f2f2;
    font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .btn-primary:hover { background: #ff563c; }
  .btn-secondary {
    height: 40px; padding: 0 18px; background: transparent; border: 1px solid rgba(243,242,242,0.3);
    border-radius: 10px; color: #f3f2f2; font-weight: 800; font-size: 13px; cursor: pointer;
  }
  .btn-secondary:hover { background: rgba(243,242,242,0.08); }

  @media (max-width: 560px) {
    .masthead { padding: 48px 20px 40px; }
    .fab { top: 16px; right: 16px; }
    .grid { padding: 0 20px 48px; gap: 16px; }
  }
</style>
</head>
<body>

<section class="masthead">
  <img src="assets/proline-logo.png" alt="Proline — Melbourne · Sydney — Built not bought">
  <h1>Sahil's Brain</h1>
  <button type="button" class="fab" id="openAdd" aria-label="Add link" title="Add link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</section>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h3>Add a link</h3>
    <p class="subcopy">It joins the list straight away.</p>
    <div class="fields">
      <label class="field">
        <span>Name</span>
        <input id="fName" type="text" placeholder="ITP Tracker" maxlength="60">
      </label>
      <label class="field">
        <span>What it is</span>
        <input id="fDesc" type="text" placeholder="Site evidence, photographed and filed" maxlength="140">
      </label>
      <label class="field">
        <span>Address</span>
        <input id="fUrl" type="text" placeholder="itptracker.vercel.app" maxlength="300">
      </label>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-primary" id="submitAdd">Add to list</button>
      <button type="button" class="btn-secondary" id="cancelAdd">Cancel</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = "sahilsBrainSites";

  const DEFAULT_SITES = [
    { name: "ProSup", desc: "Project workspace — jobs, crews and daily records in one place.", url: "prosup-jet.vercel.app" },
    { name: "ITP Tracker", desc: "Site evidence: hold points, photographed and filed against the ITP.", url: "itptracker-weld-five.vercel.app" },
    { name: "A2Z", desc: "Reference index — everything else, alphabetically.", url: "a2z-ecru.vercel.app" }
  ];

  const LOOKS = [
    {
      accent: "#ec3013",
      pattern: "repeating-linear-gradient(90deg, rgba(243,242,242,0.07) 0 1px, transparent 1px 34px), repeating-linear-gradient(0deg, rgba(243,242,242,0.07) 0 1px, transparent 1px 34px)",
      patternSize: "auto",
      surface: "radial-gradient(120% 90% at 50% 0%, #302d2d 0%, #221f1f 62%)"
    },
    {
      accent: "#ff563c",
      pattern: "repeating-linear-gradient(135deg, rgba(255,86,60,0.18) 0 2px, transparent 2px 16px)",
      patternSize: "auto",
      surface: "radial-gradient(120% 90% at 50% 0%, #332c2b 0%, #221f1f 62%)"
    },
    {
      accent: "#ff7a5f",
      pattern: "radial-gradient(rgba(243,242,242,0.16) 1.2px, transparent 1.3px)",
      patternSize: "16px 16px",
      surface: "radial-gradient(120% 90% at 50% 0%, #2e2c2c 0%, #201e1e 62%)"
    },
    {
      accent: "#ae1800",
      pattern: "repeating-linear-gradient(0deg, rgba(243,242,242,0.09) 0 1px, transparent 1px 12px)",
      patternSize: "auto",
      surface: "radial-gradient(120% 90% at 50% 0%, #2f2a29 0%, #211e1e 62%)"
    },
    {
      accent: "#ff9783",
      pattern: "repeating-linear-gradient(90deg, rgba(255,151,131,0.14) 0 3px, transparent 3px 24px)",
      patternSize: "auto",
      surface: "radial-gradient(120% 90% at 50% 0%, #332e2d 0%, #221f1f 62%)"
    },
    {
      accent: "#ec3013",
      pattern: "conic-gradient(from 45deg at 50% 50%, rgba(243,242,242,0.06) 0 25%, transparent 0 50%, rgba(243,242,242,0.06) 0 75%, transparent 0)",
      patternSize: "72px 72px",
      surface: "radial-gradient(120% 90% at 50% 0%, #302d2d 0%, #221f1f 62%)"
    }
  ];

  function loadSites() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return DEFAULT_SITES.slice();
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed) || parsed.length === 0) return DEFAULT_SITES.slice();
      return parsed;
    } catch (e) {
      return DEFAULT_SITES.slice();
    }
  }

  function saveSites(sites) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(sites)); } catch (e) {}
  }

  let sites = loadSites();

  const ARROW_ICON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f3f2f2" stroke-width="2" stroke-linecap="square"><path d="M7 17 17 7M9 7h8v8"></path></svg>';

  function render() {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";

    sites.forEach((site, i) => {
      const href = "https://" + site.url.replace(/^https?:\/\//, "");
      const num = String(i + 1).padStart(2, "0");
      const look = LOOKS[i % LOOKS.length];

      const card = document.createElement("a");
      card.className = "card";
      card.href = href;
      card.target = "_blank";
      card.rel = "noopener";
      card.style.background = look.surface;
      card.style.borderTop = "4px solid " + look.accent;

      const pattern = document.createElement("div");
      pattern.className = "pattern";
      pattern.setAttribute("aria-hidden", "true");
      pattern.style.backgroundImage = look.pattern;
      pattern.style.backgroundSize = look.patternSize;

      const numEl = document.createElement("div");
      numEl.className = "num";
      numEl.style.color = look.accent;
      numEl.textContent = num;

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.innerHTML = ARROW_ICON;

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = site.name;

      const rule = document.createElement("div");
      rule.className = "rule";
      rule.style.background = look.accent;

      card.appendChild(pattern);
      card.appendChild(numEl);
      card.appendChild(arrow);
      card.appendChild(name);
      card.appendChild(rule);

      grid.appendChild(card);
    });
  }

  const overlay = document.getElementById("overlay");
  const fName = document.getElementById("fName");
  const fDesc = document.getElementById("fDesc");
  const fUrl = document.getElementById("fUrl");

  function resetForm() { fName.value = ""; fDesc.value = ""; fUrl.value = ""; }

  function openDialog() {
    overlay.hidden = false;
    resetForm();
    fName.focus();
  }
  function closeDialog() {
    overlay.hidden = true;
    resetForm();
  }

  document.getElementById("openAdd").addEventListener("click", openDialog);
  document.getElementById("cancelAdd").addEventListener("click", closeDialog);
  overlay.addEventListener("click", (e) => { if (e.target === overlay) closeDialog(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !overlay.hidden) closeDialog(); });

  document.getElementById("submitAdd").addEventListener("click", () => {
    const name = fName.value.trim();
    const desc = fDesc.value.trim();
    const url = fUrl.value.trim();

    if (!name && !url) { closeDialog(); return; }

    sites.push({
      name: name || url,
      desc: desc || "No description yet.",
      url: url.replace(/^https?:\/\//, "") || "—"
    });
    saveSites(sites);
    render();
    closeDialog();
  });

  render();
</script>

</body>
</html>
